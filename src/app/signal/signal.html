<h2> Welcome to the world of Signals</h2>
<h4>{{ title()}}</h4>
<h4>{{ user().age}}</h4>
<h4>{{ normalVar.update }}</h4>

<div class="m-4 flex gap-4">

    <button class="px-4 py-1 bg-slate-600 text-white hover:bg-slate-700 cursor-pointer rounded" (click)="changeAge()">
        Change
    </button>
    <button class="px-4 py-1 bg-slate-600 text-white hover:bg-slate-700 cursor-pointer rounded "
        (click)="increment()">Increment</button>
</div>

<h3>

    <div>Normal Variable Count: {{ normalCounter }}</div>
    <div>Signal Count: {{ signalCounter() }}</div>
    <div>Double Count: {{ doubleCounter() }}</div>

</h3>
