<div class="p-6">
    <button (click)="createComponent()" class="bg-blue-600 text-white px-2 py-1 mb-2 rounded text-sm cursor-pointer">
        Spawn Dynamic Component as alert
    </button>

    <!-- 1. The designated anchor spot where the component will appear -->
    <!-- Wrap your anchor to isolate parent layout crushing -->
    <div class="block w-full min-h-[100px] bg-gray-50 p-4 border border-dashed border-gray-300">
        <ng-container #alertAnchor></ng-container>
    </div>

</div>
